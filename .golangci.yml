# golangci-lint configuration
# Reference: https://golangci-lint.run/usage/configuration/

# Configuration file version (required for v2.x)
version: '2'

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - goconst
    - gocyclo
    - errchkjson
    - errorlint
    - prealloc
    - whitespace
    - gosec
    - bodyclose
    - nilerr
    - nilnil
    - gocognit
    - nestif
    - gocritic
    - unconvert
    - unparam
    - wastedassign
