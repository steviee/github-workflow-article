name: CI Pipeline

# Trigger on pull requests and pushes to main
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

# Concurrency control: cancel outdated runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Environment variables shared across jobs
env:
  GO_VERSION: '1.24.x'  # Using 1.24 for golang.org/x/image compatibility
  COVERAGE_THRESHOLD: 85

jobs:
  # Job 1: Run tests with race detection and coverage
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better analysis

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests with race detector
        run: |
          # Run all tests (including cmd)
          go test -v -race ./...
          # Generate coverage only for internal packages (excludes cmd/api/main.go which is just wiring)
          go test -race -coverprofile=coverage.out -covermode=atomic ./internal/...

      - name: Check test coverage threshold
        run: |
          # Calculate coverage percentage
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Test coverage: ${COVERAGE}%"

          # Compare with threshold
          if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold ${COVERAGE_THRESHOLD}%"
          fi

      - name: Generate coverage report
        if: always()
        run: |
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 30

  # Job 2: Run linting with golangci-lint
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest  # Use latest version for Go 1.24 support
          args: --timeout=5m --config=.golangci.yml
          skip-cache: false

      - name: Check formatting with gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ The following files are not formatted correctly:"
            gofmt -l .
            echo ""
            echo "Please run 'gofmt -w .' to fix formatting issues"
            exit 1
          else
            echo "✅ All files are properly formatted"
          fi

      - name: Check imports with goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          if [ -n "$(goimports -l .)" ]; then
            echo "❌ The following files have import issues:"
            goimports -l .
            echo ""
            echo "Please run 'goimports -w .' to fix import issues"
            exit 1
          else
            echo "✅ All imports are properly formatted"
          fi

  # Job 3: Security scanning with Trivy
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'  # Report but don't fail (govulncheck is authoritative for Go)
          ignore-unfixed: false
          vuln-type: 'os,library'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()  # Upload even if scan fails
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs-scan'

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'  # Don't fail on config issues, just report
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 30

  # Job 4: Build Docker image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test build)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:test
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 7

      - name: Verify Docker image
        run: |
          docker load --input /tmp/image.tar
          docker images
          echo "✅ Docker image built successfully"

      - name: Test Docker image
        run: |
          # Load the image
          docker load --input /tmp/image.tar

          # Run container in background
          docker run -d --name test-container \
            -p 8080:8080 \
            ghcr.io/${{ github.repository }}:test

          # Wait for container to start
          sleep 5

          # Check if container is running
          if [ "$(docker ps -q -f name=test-container)" ]; then
            echo "✅ Container is running"
          else
            echo "❌ Container failed to start"
            docker logs test-container
            exit 1
          fi

          # Test health endpoint
          if curl -f http://localhost:8080/health; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            docker logs test-container
            exit 1
          fi

          # Cleanup
          docker stop test-container
          docker rm test-container

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: '/tmp/image.tar'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Docker image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-docker-scan'

  # Job 5: Summary - verify all jobs passed
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [test, lint, security, build]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "Test job: ${{ needs.test.result }}"
          echo "Lint job: ${{ needs.lint.result }}"
          echo "Security job: ${{ needs.security.result }}"
          echo "Build job: ${{ needs.build.result }}"

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Test job failed"
            exit 1
          fi

          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint job failed"
            exit 1
          fi

          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "❌ Security job failed"
            exit 1
          fi

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Build job failed"
            exit 1
          fi

          echo "✅ All CI jobs passed successfully!"

      - name: Create success summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ CI Pipeline Success

          All checks passed successfully:

          - ✅ **Tests**: All unit tests passed with race detection
          - ✅ **Coverage**: Code coverage meets ${{ env.COVERAGE_THRESHOLD }}% threshold
          - ✅ **Linting**: No linting errors found
          - ✅ **Security**: No HIGH or CRITICAL vulnerabilities detected
          - ✅ **Build**: Docker image built and tested successfully

          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}
          **Triggered by**: ${{ github.actor }}
          EOF

      - name: Post failure summary
        if: failure()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ❌ CI Pipeline Failed

          One or more checks failed. Please review the job outputs above.

          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}
          **Triggered by**: ${{ github.actor }}
          EOF
